; PlatformIO Configuration for Dog Walker GPS Tracker
; LilyGo T-A7670G R2 (ESP32-WROVER-E)

[env:lilygo-t-a7670g]
platform = espressif32
board = esp32dev
framework = arduino

; Board settings for ESP32-WROVER-E
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.partitions = default_16MB.csv

; Upload settings
upload_speed = 921600
monitor_speed = 115200

; Libraries
lib_deps =
    ; GPS parsing
    mikalhart/TinyGPSPlus@^1.0.3
    ; ADXL345 accelerometer
    adafruit/Adafruit ADXL345@^1.3.2
    ; Unified sensor library
    adafruit/Adafruit Unified Sensor@^1.1.14
    ; JSON handling
    bblanchon/ArduinoJson@^7.0.4
    ; SD card
    arduino-libraries/SD@^1.2.4

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_ESP32_DEV
    ; Define board variant
    -DLILYGO_T_A7670

; Extra scripts (optional)
; extra_scripts = pre:build_version.py
