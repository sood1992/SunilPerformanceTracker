; PlatformIO Configuration for Dog Walker GPS Tracker
; LilyGo T-A7670G R2 (ESP32-WROVER-E)

[env:lilygo-t-a7670g]
platform = espressif32
board = esp32dev
framework = arduino

; Board settings - use defaults first
board_build.mcu = esp32
board_build.f_cpu = 240000000L

; Upload settings - slower for reliability
upload_speed = 115200
monitor_speed = 115200

; Libraries
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit ADXL345@^1.3.2
    adafruit/Adafruit Unified Sensor@^1.1.14
    bblanchon/ArduinoJson@^7.0.4
    olikraus/U8g2@^2.35.9
    vshymanskyy/TinyGSM@^0.11.7

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_ESP32_DEV
    -DTINY_GSM_MODEM_SIM7600

; Extra scripts (optional)
; extra_scripts = pre:build_version.py
